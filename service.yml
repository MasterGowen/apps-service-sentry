name: sentry
display_name: Sentry
version: 1.0.0
description: Система мониторинга и отслеживания ошибок Sentry (self-hosted, минимальная конфигурация)
type: docker-compose
visibility: internal

routing:
  - type: subfolder
    base_domain: apps.openedu.urfu.ru
    path: /sentry
    internal_port: 9000
    container_name: sentry-web
    strip_prefix: true

health:
  enabled: true
  endpoint: /api/0/health/
  interval: 30s
  timeout: 10s
  retries: 3

backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 7
